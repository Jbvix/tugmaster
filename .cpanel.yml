---
# =============================================================================
# .cpanel.yml - TUGLIFE LAB / portal tugmaster (deploy cPanel Git Version Control)
# Autor: Jossian Brito (Charlie Bravo) | Assistido por Claude
# Data: 2026-10-14   Versão: 2.0
# -----------------------------------------------------------------------------
# HISTÓRICO
#  v1.0 - cp -R * para ~/public_html/tugmaster
#  v2.0 - Registra cada deploy em ~/deploy_log.txt.
# NOTAS
#  - "cp -R *" NÃO copia arquivos ocultos: o .htaccess de produção (bloqueio
#    de js/, error_log, CHANGELOG) nunca é sobrescrito.
#  - "cp -R" não apaga arquivos removidos do repositório (limpeza é manual).
# =============================================================================
deployment:
  tasks:
    - export DEPLOYPATH=/home/c62gtwye66po/public_html/tugmaster
    - /bin/mkdir -p $DEPLOYPATH
    - /bin/cp -R * $DEPLOYPATH/
    - /bin/echo "$(/bin/date '+%Y-%m-%d %H:%M:%S') tugmaster $(git rev-parse --short HEAD 2>/dev/null)" >> /home/c62gtwye66po/deploy_log.txt || true
